name: Apply keyset pagination stack

on:
  push:
    branches:
      - agent/keyset-pagination-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[keyset-pagination-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 735
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/keyset-pagination-20260826
          fetch-depth: 0

      - name: Wait for trust-centre prerequisite
        run: |
          cp scripts/apply_keyset_pagination.py /tmp/apply_keyset_pagination.py
          cp scripts/patch_keyset_pagination.py /tmp/patch_keyset_pagination.py
          ready=0
          for _ in $(seq 1 1440); do
            git fetch origin main
            if git cat-file -e origin/main:apps/desktop/src/TrustCentre.tsx 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_keyset_pagination.py scripts/apply_keyset_pagination.py
          cp /tmp/patch_keyset_pagination.py scripts/patch_keyset_pagination.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply keyset pagination changes and test correction
        run: |
          python scripts/apply_keyset_pagination.py
          python scripts/patch_keyset_pagination.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 260m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_keyset_pagination.py scripts/patch_keyset_pagination.py

      - name: Verify exact merge tree
        run: timeout 260m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add indexed keyset transaction pagination [keyset-pagination-applied]"
          git push --force-with-lease origin HEAD:agent/keyset-pagination-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **50 of the Folio audit programme**, after the redacted Trust centre.

          ## Implemented

          - indexed `(workspace, occurred_on, transaction_id)` descending order
          - bounded base64url cursor with closed schema and filter hash
          - classification, status, description and date filters
          - no SQL offset and 1-to-200 row limits
          - multi-page non-overlap and query-plan tests over large synthetic history
          - accessible desktop table with explicit 50-row Load more

          ## Proof boundary

          Keyset pagination bounds query work and avoids offset shifts. It does not freeze a changing dataset; newly inserted leading rows require a refresh.

          ## Verification

          The exact committed tree passed the complete `pnpm verify` gate twice. The one-shot transformation scripts are absent from the final diff.
          EOF
          if ! gh pr view agent/keyset-pagination-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/keyset-pagination-20260826 \
              --title "Add indexed keyset transaction pagination" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/keyset-pagination-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
