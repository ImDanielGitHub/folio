name: Apply provider and run correctness

on:
  push:
    branches:
      - agent/provider-run-correctness-20260826

permissions:
  contents: write

concurrency:
  group: apply-provider-run-correctness
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[provider-run-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
    steps:
      - name: Check out correctness branch
        uses: actions/checkout@v4
        with:
          ref: agent/provider-run-correctness-20260826
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Verify staged fragments
        run: |
          wc -c .audit-stack/provider-run.part*
          cat > /tmp/provider-run-parts.sha256 <<'EOF'
          9275510bd4f3da0e5afdb014bb52a0d031b15b067f2ec70dcdc10795eb8c3164  .audit-stack/provider-run.part00
          492675c8f1a76cabec311817e79b7e5d6bf3ca72cadc83856f3248f71bdf8fc5  .audit-stack/provider-run.part01
          5826fcc52a91db2bb2c31a15b2443caa7e03e22c9f44139501173eb341428165  .audit-stack/provider-run.part02
          07adc429e0706fbbaeec4e7c5a5652d6bf9b99c991657b46379f2b1f780facd9  .audit-stack/provider-run.part03
          38f10e80085e68d393924125238014af80ea380a052e7b0263f03c6fdd11cae  .audit-stack/provider-run.part04
          9664b8757bd0726119a8fa679fcd07c11434caaa52e65be88d8983caa0a01991  .audit-stack/provider-run.part05
          4fc24d16c09c0171196b96dfb25f94a33337c8145834dd515d61e1eb2f9bfb7f  .audit-stack/provider-run.part06
          8e5fa7838dafd4a5c2385e533ffae24bab959a644171301bd918506a343b5609  .audit-stack/provider-run.part07
          EOF
          sha256sum -c /tmp/provider-run-parts.sha256

      - name: Reconstruct and apply verified source bundle
        run: |
          cat .audit-stack/provider-run.part* | base64 --decode > /tmp/provider-run-files.tar.gz
          echo "eab9d75f40aac303c68f9daf5ef956adf02013a84321d58094af4f0f47abf8f2  /tmp/provider-run-files.tar.gz" | sha256sum -c -
          tar -xzf /tmp/provider-run-files.tar.gz

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe Ruff fixes
        run: pnpm lint:fix

      - name: Verify repository
        run: timeout 25m pnpm verify

      - name: Remove one-shot staging machinery
        run: |
          rm -rf .audit-stack
          rm -f .github/workflows/apply-provider-run-correctness.yml

      - name: Commit verified correctness slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete provider and run correctness semantics [provider-run-applied]"
          git push origin HEAD:agent/provider-run-correctness-20260826
