name: Apply desktop search palette stack

on:
  push:
    branches:
      - agent/desktop-search-palette-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[desktop-search-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 525
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-search-palette-20260826
          fetch-depth: 0

      - name: Wait for signed-update prerequisite
        run: |
          cp scripts/apply_desktop_search_palette.py /tmp/apply_desktop_search_palette.py
          ready=0
          for _ in $(seq 1 1020); do
            git fetch origin main
            if git cat-file -e origin/main:apps/desktop/src/main/updateManifest.ts 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_desktop_search_palette.py scripts/apply_desktop_search_palette.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply desktop search changes
        run: python scripts/apply_desktop_search_palette.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 190m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_desktop_search_palette.py

      - name: Verify exact merge tree
        run: timeout 190m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add accessible desktop local search palette [desktop-search-applied]"
          git push --force-with-lease origin HEAD:agent/desktop-search-palette-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **36 of the Folio audit programme**, after the signed update channel.

          ## Implemented

          - Cmd/Ctrl+K accessible local-search dialog
          - focused input, Tab containment, Escape and click-away close
          - debounced and abortable loopback search
          - typed exact-money/evidence result rendering
          - prepare-only handoff into the existing conversation composer
          - mobile and reduced-motion rules plus component/contract tests

          ## Proof boundary

          Selecting a result prepares a message. It does not execute a finance action or make search an authority for financial meaning.

          ## Verification

          The exact committed tree passed the complete `pnpm verify` gate, including component and UI-contract tests. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/desktop-search-palette-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/desktop-search-palette-20260826 \
              --title "Add an accessible desktop local-search palette" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/desktop-search-palette-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
