name: Apply egress consent stack

on:
  push:
    branches:
      - agent/egress-consent-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[egress-consent-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 375
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/egress-consent-20260826
          fetch-depth: 0

      - name: Wait for invoice-draft prerequisite
        run: |
          cp scripts/apply_egress_consent.py /tmp/apply_egress_consent.py
          ready=0
          for _ in $(seq 1 720); do
            git fetch origin main
            if git cat-file -e origin/main:services/api/src/finance_agent/finance/invoices.py 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_egress_consent.py scripts/apply_egress_consent.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply egress consent changes
        run: python scripts/apply_egress_consent.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 135m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_egress_consent.py

      - name: Verify exact merge tree
        run: timeout 135m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: require explicit workspace consent for cloud egress [egress-consent-applied]"
          git push --force-with-lease origin HEAD:agent/egress-consent-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **26 of the Folio audit programme**, after invoice draft preparation.

          ## Implemented

          - workspace-specific append-only Hybrid/Cloud consent
          - exact confirmation phrase, allowed modes and allowed field classes
          - character, item and expiry bounds
          - value-free projection previews containing only classes, paths and counts
          - immediate append-only revocation
          - cloud-turn enforcement before conversation mutation or provider invocation

          ## Proof boundary

          Consent does not make a provider ready, prove a result, or permit raw sources, credentials or complete ledger history to leave the computer.

          ## Verification

          The exact committed tree passed the complete `pnpm verify` gate. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/egress-consent-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/egress-consent-20260826 \
              --title "Require explicit workspace consent for cloud egress" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/egress-consent-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
