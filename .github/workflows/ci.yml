name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify contracts, API, desktop and offline harness
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --project services/api --frozen

      - name: Verify safe lint fixes are committed
        id: lint-fix
        run: |
          pnpm lint:fix
          if ! git diff --quiet; then
            git diff --binary > ruff-fixes.patch
            exit 1
          fi

      - name: Upload safe lint fixes
        if: failure() && steps.lint-fix.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-fixes
          if-no-files-found: error
          path: |
            ruff-fixes.patch
            services/api/src/finance_agent/api/routes/router.py
            services/api/tests/agent/test_harness_controller.py
            services/api/tests/agent/test_routes_sse.py
            services/api/tests/api/test_http_security.py
            services/api/tests/connectors/test_akahu_fixture.py
            services/api/tests/connectors/test_akahu_live.py
            services/api/tests/connectors/test_plaid_fixture.py
            services/api/tests/connectors/test_plaid_live.py
            services/api/tests/connectors/test_telegram.py
            services/api/tests/finance/test_bank_csv_ingest.py
            services/api/tests/integration/test_golden_api.py
            services/api/tests/integration/test_working_understanding_continuity.py
            services/api/tests/models/test_lm_studio.py
            services/api/tests/models/test_model_configuration.py
            services/api/tests/models/test_narrative_guard.py
            services/api/tests/storage/test_knowledge.py

      - name: Run the repository verification gate
        run: pnpm verify
