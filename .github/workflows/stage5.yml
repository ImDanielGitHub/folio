name: Stage 5 run lifecycle

on:
  push:
    branches:
      - automation/stage-5-run-lifecycle

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  build-review-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ImDanielGitHub/folio
      PRODUCT_BRANCH: stage/05-run-lifecycle

    steps:
      - name: Check out stage automation
        uses: actions/checkout@v4
        with:
          path: automation
          fetch-depth: 1

      - name: Wait for Stage 4 to be merged
        run: |
          for attempt in $(seq 1 140); do
            count=$(gh pr list --repo "$REPOSITORY" --state merged \
              --search "head:stage/04-data-durability" \
              --json number --jq 'length' 2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then exit 0; fi
            echo "Waiting for the verified Stage 4 merge (${attempt}/140)."
            sleep 15
          done
          echo "Stage 4 did not merge before the safety timeout." >&2
          exit 1

      - name: Check out the merged product base
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Create an isolated product branch
        working-directory: repo
        run: |
          if git ls-remote --exit-code --heads origin "$PRODUCT_BRANCH" >/dev/null 2>&1; then
            echo "${PRODUCT_BRANCH} already exists; refusing an implicit overwrite." >&2
            exit 1
          fi
          git switch -c "$PRODUCT_BRANCH"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repo/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install locked dependencies
        working-directory: repo
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Materialise Stage 5 tests and implementation
        working-directory: repo
        run: python ../automation/automation/stage5_impl.py

      - name: Preserve only lifecycle tests for the red check
        working-directory: repo
        run: |
          rm -rf /tmp/stage5-tests
          mkdir -p /tmp/stage5-tests
          cp -a services/api/tests/. /tmp/stage5-tests/
          git reset --hard HEAD
          git clean -fd
          rm -rf services/api/tests
          mkdir -p services/api/tests
          cp -a /tmp/stage5-tests/. services/api/tests/

      - name: Verify Stage 5 regression tests fail before implementation
        working-directory: repo
        run: |
          set +e
          uv run --project services/api pytest -q services/api/tests/api/test_run_lifecycle.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Stage 5 lifecycle tests unexpectedly passed on the unmodified product." >&2
            exit 1
          fi
          echo "RED confirmed for background acceptance, cancellation and terminal events."

      - name: Restore the clean product and apply Stage 5
        working-directory: repo
        run: |
          git reset --hard HEAD
          git clean -fd
          python ../automation/automation/stage5_impl.py
          pnpm lint:fix

      - name: Verify targeted Stage 5 behaviour
        working-directory: repo
        run: uv run --project services/api pytest -q services/api/tests/api/test_run_lifecycle.py

      - name: Run the complete repository verification gate
        working-directory: repo
        env:
          LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
          OPENAI_API_KEY: ""
          FOLIO_SESSION_TOKEN: stage5-ci-session
          VITE_FOLIO_SESSION_TOKEN: stage5-ci-session
        run: pnpm verify

      - name: Commit and push the verified stage
        id: commit
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src services/api/src services/api/tests
          git diff --cached --check
          git commit -m "feat: add cancellable owner-turn run lifecycle"
          git push --set-upstream origin "$PRODUCT_BRANCH"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open the Stage 5 pull request
        id: pr
        working-directory: repo
        run: |
          cat > /tmp/stage5-body.md <<'EOF'
          ## Stage 5 of the Folio audit programme

          This stage makes run progress and cancellation correspond to the backend rather than only the browser window.

          ### Changes

          - acknowledge owner-turn runs before model work completes
          - keep an explicit accepted, planning, executing and terminal lifecycle
          - allow cancellation only during accepted or planning phases
          - reject cancellation after deterministic execution starts
          - make duplicate cancellation requests idempotent
          - emit ordered `run.started` and terminal `run.failed` cancellation events
          - poll resumable SSE batches until a real terminal event arrives
          - connect the desktop Stop action to the backend cancellation endpoint
          - cancel outstanding planning tasks during service shutdown
          - preserve the existing synchronous service method for direct integration tests

          ### Evidence

          The workflow proves lifecycle tests fail on the merged Stage 4 base, then runs the targeted asynchronous suite and the full verification gate. Merge remains conditional on PR checks.

          ### Audit coverage

          Primary items: run correctness B131-B143, SSE recovery B144-B150, truthful stop/recovery UX I041-I049 and concurrency controls B159-B166.
          EOF
          url=$(gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "$PRODUCT_BRANCH" \
            --title "Stage 5: make run progress and cancellation backend-authoritative" \
            --body-file /tmp/stage5-body.md)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Wait for Stage 5 pull-request checks
        run: |
          sleep 12
          for attempt in $(seq 1 36); do
            if gh pr checks "${{ steps.pr.outputs.url }}" --watch --fail-fast; then exit 0; fi
            echo "Stage 5 checks are not ready or not green (${attempt}/36)."
            sleep 10
          done
          exit 1

      - name: Merge verified Stage 5
        run: |
          gh pr merge "${{ steps.pr.outputs.url }}" \
            --squash \
            --delete-branch \
            --match-head-commit "${{ steps.commit.outputs.head_sha }}"
