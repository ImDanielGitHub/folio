name: Apply NZ GST accounting stack

on:
  push:
    branches:
      - agent/nz-gst-accounting-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[nz-gst-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nz-gst-accounting-20260826
          fetch-depth: 0

      - name: Wait for supply-chain security prerequisite
        run: |
          cp scripts/apply_nz_gst_accounting.py /tmp/apply_nz_gst_accounting.py
          ready=0
          for _ in $(seq 1 300); do
            git fetch origin main
            if git cat-file -e origin/main:docs/THREAT_MODEL.md 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_nz_gst_accounting.py scripts/apply_nz_gst_accounting.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply NZ GST preparation changes
        run: python scripts/apply_nz_gst_accounting.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 60m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_nz_gst_accounting.py

      - name: Verify exact merge tree
        run: timeout 60m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add deterministic NZ GST preparation and accountant exports [nz-gst-applied]"
          git push --force-with-lease origin HEAD:agent/nz-gst-accounting-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **12 of the Folio audit programme**, after supply-chain security.

          ## Implemented

          - explicit per-category GST treatment
          - exact standard-rate GST-inclusive calculation in integer minor units
          - separate zero-rated, exempt, out-of-scope, personal, and unreviewed states
          - draft status while any business transaction remains unreviewed
          - append-only GST working-paper revisions with `filed: false`
          - evidence-linked neutral CSV export for accountant handoff

          ## Proof boundary

          Folio prepares a payments-basis working paper. It does not determine legal deductibility, file a GST return, or claim Inland Revenue acceptance.

          ## Verification

          The exact committed tree passed the full `pnpm verify` gate. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/nz-gst-accounting-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/nz-gst-accounting-20260826 \
              --title "Add deterministic New Zealand GST working papers" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/nz-gst-accounting-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
