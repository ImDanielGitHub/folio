name: Stage 10 Telegram live ingestion

on:
  push:
    branches:
      - automation/stage-10-telegram-live

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  build-review-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ImDanielGitHub/folio
      PRODUCT_BRANCH: stage/10-telegram-live

    steps:
      - name: Check out stage automation
        uses: actions/checkout@v4
        with:
          path: automation
          fetch-depth: 1

      - name: Wait for Stage 9 to be merged
        run: |
          for attempt in $(seq 1 240); do
            count=$(gh pr list --repo "$REPOSITORY" --state merged \
              --search "head:stage/09-owner-data-control" \
              --json number --jq 'length' 2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then exit 0; fi
            echo "Waiting for the verified Stage 9 merge (${attempt}/240)."
            sleep 15
          done
          echo "Stage 9 did not merge before the safety timeout." >&2
          exit 1

      - name: Check out the merged product base
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Create an isolated product branch
        working-directory: repo
        run: |
          if git ls-remote --exit-code --heads origin "$PRODUCT_BRANCH" >/dev/null 2>&1; then
            echo "${PRODUCT_BRANCH} already exists; refusing an implicit overwrite." >&2
            exit 1
          fi
          git switch -c "$PRODUCT_BRANCH"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repo/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install locked dependencies
        working-directory: repo
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Materialise Stage 10 tests and implementation
        working-directory: repo
        run: python ../automation/automation/stage10_impl.py

      - name: Preserve only Telegram tests for the red check
        working-directory: repo
        run: |
          rm -rf /tmp/stage10-tests
          mkdir -p /tmp/stage10-tests
          cp -a services/api/tests/. /tmp/stage10-tests/
          git reset --hard HEAD
          git clean -fd
          rm -rf services/api/tests
          mkdir -p services/api/tests
          cp -a /tmp/stage10-tests/. services/api/tests/

      - name: Verify Stage 10 regression tests fail before implementation
        working-directory: repo
        run: |
          set +e
          uv run --project services/api pytest -q \
            services/api/tests/connectors/test_telegram_live.py \
            services/api/tests/api/test_telegram_webhook_security.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Stage 10 Telegram tests unexpectedly passed on the unmodified product." >&2
            exit 1
          fi
          echo "RED confirmed for polling, webhook authentication, replay and attachments."

      - name: Restore the clean product and apply Stage 10
        working-directory: repo
        run: |
          git reset --hard HEAD
          git clean -fd
          python ../automation/automation/stage10_impl.py
          pnpm lint:fix

      - name: Verify targeted Stage 10 behaviour
        working-directory: repo
        run: |
          uv run --project services/api pytest -q \
            services/api/tests/connectors/test_telegram_live.py \
            services/api/tests/api/test_telegram_webhook_security.py

      - name: Run the complete repository verification gate
        working-directory: repo
        env:
          LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
          OPENAI_API_KEY: ""
          FOLIO_SESSION_TOKEN: stage10-ci-session
          VITE_FOLIO_SESSION_TOKEN: stage10-ci-session
          TELEGRAM_LIVE_ENABLED: "false"
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_ALLOWED_CHAT_ID: ""
          TELEGRAM_WEBHOOK_SECRET: ""
        run: pnpm verify

      - name: Commit and push the verified stage
        id: commit
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example package.json run docs scripts services/api/src services/api/tests
          git diff --cached --check
          git commit -m "feat: add secure read-only Telegram ingestion"
          git push --set-upstream origin "$PRODUCT_BRANCH"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open the Stage 10 pull request
        id: pr
        working-directory: repo
        run: |
          cat > /tmp/stage10-body.md <<'EOF'
          ## Stage 10 of the Folio audit programme

          This stage replaces the Telegram-shaped fixture-only boundary with a real, optional read-only ingestion route while preserving the local-first trust model.

          ### Changes

          - add config-gated Telegram Bot API polling with a durable update cursor
          - add an optional webhook route authenticated by Telegram's exact secret-token header
          - keep the ordinary Folio `/v1` routes protected by the desktop session
          - allowlist one owner chat and reject bot senders, unsupported payloads and replays
          - bound updates to 1 MB and attachments to 5 MB
          - pin all token-bearing provider calls and downloads to `api.telegram.org`
          - store accepted messages as source evidence and connector-backed knowledge documents
          - hash provider file identifiers rather than persisting bot tokens
          - quarantine unsupported, oversized or failed attachments
          - add a launcher-managed polling process only when Telegram is explicitly enabled
          - implement no outbound messages, payments or other Telegram mutations

          ### Evidence

          The workflow records a red Telegram suite on the merged Stage 9 base, then runs provider, webhook and attachment tests plus the complete repository gate. Merge remains conditional on PR checks.

          ### Audit coverage

          Primary items: Telegram integration I142-I157, webhook security B281-B291, attachment quarantine B292-B304, replay/allowlist controls B305-B315 and connector privacy I158-I164.
          EOF
          url=$(gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "$PRODUCT_BRANCH" \
            --title "Stage 10: add secure read-only Telegram ingestion" \
            --body-file /tmp/stage10-body.md)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Wait for Stage 10 pull-request checks
        run: |
          sleep 12
          for attempt in $(seq 1 36); do
            if gh pr checks "${{ steps.pr.outputs.url }}" --watch --fail-fast; then exit 0; fi
            echo "Stage 10 checks are not ready or not green (${attempt}/36)."
            sleep 10
          done
          exit 1

      - name: Merge verified Stage 10
        run: |
          gh pr merge "${{ steps.pr.outputs.url }}" \
            --squash \
            --delete-branch \
            --match-head-commit "${{ steps.commit.outputs.head_sha }}"
