name: Stage 2 Source Export

on:
  push:
    branches:
      - agent/stage2-source-export-20260827

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Stage 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/provider-run-correctness-20260826
          fetch-depth: 1

      - name: Create source archive
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=services/api/.venv \
            -czf /tmp/folio-stage2-staging.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: folio-stage2-staging
          path: /tmp/folio-stage2-staging.tar.gz
          if-no-files-found: error
          retention-days: 1
