name: Apply supply chain security stack

on:
  push:
    branches:
      - agent/supply-chain-security-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[supply-chain-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 135
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supply-chain-security-20260826
          fetch-depth: 0

      - name: Wait for privacy-lifecycle prerequisite
        run: |
          cp scripts/apply_supply_chain_security.py /tmp/apply_supply_chain_security.py
          ready=0
          for _ in $(seq 1 270); do
            git fetch origin main
            if git cat-file -e origin/main:services/api/src/finance_agent/storage/privacy.py 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_supply_chain_security.py scripts/apply_supply_chain_security.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply supply-chain security changes
        run: python scripts/apply_supply_chain_security.py

      - name: Refresh Python lockfile
        run: uv lock --project services/api

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify repository and dependency advisories
        run: |
          timeout 55m pnpm verify
          pnpm audit --audit-level=high
          uv run --project services/api pip-audit

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_supply_chain_security.py

      - name: Verify exact merge tree
        run: |
          timeout 55m pnpm verify
          pnpm audit --audit-level=high
          uv run --project services/api pip-audit

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: add permanent supply chain and repository security [supply-chain-applied]"
          git push --force-with-lease origin HEAD:agent/supply-chain-security-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **11 of the Folio audit programme**, after privacy lifecycle controls.

          ## Implemented

          - static credential, example-env, Electron-boundary, and workflow-permission checks
          - weekly Dependabot for JavaScript, Python, and GitHub Actions
          - dependency review with high-severity and licence gates
          - CodeQL for Python and TypeScript
          - full-history Gitleaks scanning
          - blocking npm and Python advisory audits
          - threat model, dependency policy, CODEOWNERS, and pull-request proof template

          ## Verification

          The exact committed tree passed `pnpm verify`, `pnpm audit --audit-level=high`, and `pip-audit`. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/supply-chain-security-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/supply-chain-security-20260826 \
              --title "Add permanent supply-chain and repository security gates" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/supply-chain-security-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
