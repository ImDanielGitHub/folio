name: Apply local role access stack

on:
  push:
    branches:
      - agent/local-role-access-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[local-role-access-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-role-access-20260826
          fetch-depth: 0

      - name: Wait for unified-audit prerequisite
        run: |
          cp scripts/apply_local_role_access.py /tmp/apply_local_role_access.py
          ready=0
          for _ in $(seq 1 930); do
            git fetch origin main
            if git cat-file -e origin/main:services/api/src/finance_agent/audit_trail.py 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_local_role_access.py scripts/apply_local_role_access.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply local role access changes
        run: python scripts/apply_local_role_access.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 175m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_local_role_access.py

      - name: Verify exact merge tree
        run: timeout 175m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add optional local owner and accountant roles [local-role-access-applied]"
          git push --force-with-lease origin HEAD:agent/local-role-access-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **33 of the Folio audit programme**, after the unified audit trail.

          ## Implemented

          - one-time local owner/accountant tokens stored only as SHA-256 hashes
          - expiry, last-use and revocation
          - accountant read and bounded preparation permissions
          - owner-only enforcement for source, connector, conversation, consent, policy, settlement and destructive mutation paths
          - fail-closed API behaviour when role sessions are enabled

          ## Proof boundary

          This is application-level control over the loopback API. It does not stop the same OS user reading database files and is not internet-facing multi-user authentication.

          ## Verification

          The exact committed tree passed the complete `pnpm verify` gate. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/local-role-access-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/local-role-access-20260826 \
              --title "Add optional local owner and accountant roles" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/local-role-access-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
