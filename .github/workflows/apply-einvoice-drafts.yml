name: Apply invoice draft stack

on:
  push:
    branches:
      - agent/einvoice-drafts-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[einvoice-drafts-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/einvoice-drafts-20260826
          fetch-depth: 0

      - name: Wait for provider-resilience prerequisite
        run: |
          cp scripts/apply_einvoice_drafts.py /tmp/apply_einvoice_drafts.py
          ready=0
          for _ in $(seq 1 690); do
            git fetch origin main
            if git cat-file -e origin/main:services/api/src/finance_agent/connectors/provider_http.py 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_einvoice_drafts.py scripts/apply_einvoice_drafts.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply invoice draft changes
        run: python scripts/apply_einvoice_drafts.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 130m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_einvoice_drafts.py

      - name: Verify exact merge tree
        run: timeout 130m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add exact invoice and UBL draft preparation [einvoice-drafts-applied]"
          git push --force-with-lease origin HEAD:agent/einvoice-drafts-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **25 of the Folio audit programme**, after bounded provider resilience.

          ## Implemented

          - exact NZD invoice lines, quantities, prices and GST treatments
          - append-only draft, issued and void revisions
          - immutable issued invoice content
          - deterministic UBL 2.1 Invoice XML
          - supplier, customer, dates, tax, totals and line structure
          - explicit non-delivery and non-payment state

          ## Proof boundary

          The XML uses a Folio draft customisation ID. This PR does not claim Peppol/MBIE network conformance, registration, transmission, recipient acceptance, payment or accounting-system posting.

          ## Verification

          The exact committed tree passed the complete `pnpm verify` gate. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/einvoice-drafts-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/einvoice-drafts-20260826 \
              --title "Add exact invoice and UBL draft preparation" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/einvoice-drafts-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
