name: Stage 4 data durability

on:
  push:
    branches:
      - automation/stage-4-data-durability

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  build-review-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ImDanielGitHub/folio
      PRODUCT_BRANCH: stage/04-data-durability

    steps:
      - name: Check out stage automation
        uses: actions/checkout@v4
        with:
          path: automation
          fetch-depth: 1

      - name: Wait for Stage 3 to be merged
        run: |
          for attempt in $(seq 1 120); do
            count=$(gh pr list --repo "$REPOSITORY" --state merged \
              --search "head:stage/03-local-security" \
              --json number --jq 'length' 2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then exit 0; fi
            echo "Waiting for the verified Stage 3 merge (${attempt}/120)."
            sleep 15
          done
          echo "Stage 3 did not merge before the safety timeout." >&2
          exit 1

      - name: Check out the merged product base
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Create an isolated product branch
        working-directory: repo
        run: |
          if git ls-remote --exit-code --heads origin "$PRODUCT_BRANCH" >/dev/null 2>&1; then
            echo "${PRODUCT_BRANCH} already exists; refusing an implicit overwrite." >&2
            exit 1
          fi
          git switch -c "$PRODUCT_BRANCH"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repo/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install locked dependencies
        working-directory: repo
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Materialise Stage 4 tests and implementation
        working-directory: repo
        run: python ../automation/automation/stage4_impl.py

      - name: Preserve only backup tests for the red check
        working-directory: repo
        run: |
          rm -rf /tmp/stage4-tests
          mkdir -p /tmp/stage4-tests
          cp -a services/api/tests/. /tmp/stage4-tests/
          git reset --hard HEAD
          git clean -fd
          rm -rf services/api/tests
          mkdir -p services/api/tests
          cp -a /tmp/stage4-tests/. services/api/tests/

      - name: Verify Stage 4 regression tests fail before implementation
        working-directory: repo
        run: |
          set +e
          uv run --project services/api pytest -q services/api/tests/storage/test_backups.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Stage 4 backup tests unexpectedly passed on the unmodified product." >&2
            exit 1
          fi
          echo "RED confirmed for verified backups, retention and configured database paths."

      - name: Restore the clean product and apply Stage 4
        working-directory: repo
        run: |
          git reset --hard HEAD
          git clean -fd
          python ../automation/automation/stage4_impl.py
          pnpm lint:fix

      - name: Verify targeted Stage 4 behaviour
        working-directory: repo
        run: uv run --project services/api pytest -q services/api/tests/storage/test_backups.py

      - name: Run the complete repository verification gate
        working-directory: repo
        env:
          LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
          OPENAI_API_KEY: ""
          FOLIO_SESSION_TOKEN: stage4-ci-session
          VITE_FOLIO_SESSION_TOKEN: stage4-ci-session
        run: pnpm verify

      - name: Commit and push the verified stage
        id: commit
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts services/api/src services/api/tests
          git diff --cached --check
          git commit -m "feat: add verified local database backups"
          git push --set-upstream origin "$PRODUCT_BRANCH"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open the Stage 4 pull request
        id: pr
        working-directory: repo
        run: |
          cat > /tmp/stage4-body.md <<'EOF'
          ## Stage 4 of the Folio audit programme

          This stage establishes durable local backup evidence before adding more autonomous work.

          ### Changes

          - honour `FINANCE_DATABASE_PATH` in the actual API composition root
          - resolve the database path and apply private local file permissions where supported
          - enable stronger SQLite durability and schema-safety pragmas
          - create online SQLite backups using the native backup API
          - verify quick-check, foreign keys, page count and SHA-256 before recording success
          - keep bounded backup retention while retaining immutable receipts for pruned copies
          - expose authenticated create/list backup routes
          - add an operator CLI for backup creation and independent verification
          - test snapshot consistency, retention, configured paths, permissions and tamper detection

          ### Evidence

          The workflow proves the backup tests fail on the merged Stage 3 base, then runs the targeted suite and the complete verification gate. Merge remains conditional on the PR checks.

          ### Audit coverage

          Primary items: data durability B091-B105, recovery evidence B111-B118, configuration consistency B121-B126 and operational tooling B181-B187.
          EOF
          url=$(gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "$PRODUCT_BRANCH" \
            --title "Stage 4: add verified local backup and durability controls" \
            --body-file /tmp/stage4-body.md)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Wait for Stage 4 pull-request checks
        run: |
          sleep 12
          for attempt in $(seq 1 36); do
            if gh pr checks "${{ steps.pr.outputs.url }}" --watch --fail-fast; then exit 0; fi
            echo "Stage 4 checks are not ready or not green (${attempt}/36)."
            sleep 10
          done
          exit 1

      - name: Merge verified Stage 4
        run: |
          gh pr merge "${{ steps.pr.outputs.url }}" \
            --squash \
            --delete-branch \
            --match-head-commit "${{ steps.commit.outputs.head_sha }}"
