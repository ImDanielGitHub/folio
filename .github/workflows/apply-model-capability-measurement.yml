name: Apply model capability measurement stack

on:
  push:
    branches:
      - agent/model-capability-measurement-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[capability-measurement-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 255
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/model-capability-measurement-20260826
          fetch-depth: 0

      - name: Wait for reconciliation prerequisite
        run: |
          cp scripts/apply_model_capability_measurement.py /tmp/apply_model_capability_measurement.py
          ready=0
          for _ in $(seq 1 480); do
            git fetch origin main
            if git cat-file -e origin/main:services/api/src/finance_agent/finance/reconciliation.py 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_model_capability_measurement.py scripts/apply_model_capability_measurement.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply model capability measurement changes
        run: python scripts/apply_model_capability_measurement.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 90m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_model_capability_measurement.py

      - name: Verify exact merge tree
        run: timeout 90m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: measure model capability instead of assuming it [capability-measurement-applied]"
          git push --force-with-lease origin HEAD:agent/model-capability-measurement-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **18 of the Folio audit programme**, after deterministic reconciliation.

          ## Implemented

          - fixed adversarial capability corpus across tiers 0 to 3
          - explicit prompt-injection and payment-refusal cases
          - contiguous tier award rules
          - provider/model/corpus-specific measurement persistence
          - capability endpoint overlay only for exact measured models
          - removal of the unmeasured configured-cloud tier-3 assumption
          - explicit local and cloud measurement commands

          ## Proof boundary

          CI validates the evaluator with deterministic fake adapters. It does not claim a live LM Studio or OpenAI benchmark result.

          ## Verification

          The exact committed tree passed the complete `pnpm verify` gate. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/model-capability-measurement-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/model-capability-measurement-20260826 \
              --title "Measure model capability instead of assuming it" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/model-capability-measurement-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
