name: Apply adversarial invariant stack

on:
  push:
    branches:
      - agent/adversarial-invariants-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[adversarial-invariants-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 450
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adversarial-invariants-20260826
          fetch-depth: 0

      - name: Wait for support-bundle prerequisite
        run: |
          cp scripts/apply_adversarial_invariants.py /tmp/apply_adversarial_invariants.py
          ready=0
          for _ in $(seq 1 870); do
            git fetch origin main
            if git cat-file -e origin/main:services/api/src/finance_agent/support_bundle.py 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_adversarial_invariants.py scripts/apply_adversarial_invariants.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply adversarial invariant changes
        run: python scripts/apply_adversarial_invariants.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 165m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_adversarial_invariants.py

      - name: Verify exact merge tree
        run: timeout 165m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: add adversarial finance and migration invariants [adversarial-invariants-applied]"
          git push --force-with-lease origin HEAD:agent/adversarial-invariants-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **31 of the Folio audit programme**, after redacted support bundles.

          ## Implemented

          - seeded practical CSV generators and exact-total assertions
          - no-partial-commit checks for malformed and ambiguous statements
          - thousands of signed-money and forecast prefix-sum invariants
          - adversarial contract mutation checks, including float minor units
          - supported partial-schema replay to the clean current schema
          - SQLite integrity and foreign-key checks after every replay

          ## Proof boundary

          This strengthens deterministic regression evidence. It does not claim safety for arbitrary hand-edited or unknown future databases.

          ## Verification

          The exact committed tree passed the complete `pnpm verify` gate, including the adversarial suite. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/adversarial-invariants-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/adversarial-invariants-20260826 \
              --title "Add adversarial finance and migration invariants" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/adversarial-invariants-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
