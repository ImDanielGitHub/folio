name: Apply CSV import preview stack

on:
  push:
    branches:
      - agent/csv-import-preview-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[csv-preview-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 570
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/csv-import-preview-20260826
          fetch-depth: 0

      - name: Wait for rule-management prerequisite
        run: |
          cp scripts/apply_csv_import_preview.py /tmp/apply_csv_import_preview.py
          ready=0
          for _ in $(seq 1 1110); do
            git fetch origin main
            if git cat-file -e origin/main:services/api/src/finance_agent/finance/rule_management.py 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_csv_import_preview.py scripts/apply_csv_import_preview.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply CSV preview changes
        run: python scripts/apply_csv_import_preview.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 205m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_csv_import_preview.py

      - name: Verify exact merge tree
        run: timeout 205m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add non mutating CSV import preview [csv-preview-applied]"
          git push --force-with-lease origin HEAD:agent/csv-import-preview-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **39 of the Folio audit programme**, after classification-rule lifecycle management.

          ## Implemented

          - non-mutating practical/canonical CSV preview
          - exact mapping, account, date, amount, pending, duplicate and lock summaries
          - bounded sample rows and explicit warnings
          - SHA-256 and 30-minute preview receipt without stored upload bytes
          - exact-byte, unexpired, account-bound commitment
          - idempotent repeated commitment through the existing atomic importer

          ## Proof boundary

          Preview does not prove statement completeness, sign convention correctness or that a hard-locked period should be reopened.

          ## Verification

          The exact committed tree passed the complete `pnpm verify` gate twice. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/csv-import-preview-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/csv-import-preview-20260826 \
              --title "Add non-mutating bank CSV import previews" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/csv-import-preview-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
