name: Apply renderer resilience stack

on:
  push:
    branches:
      - agent/renderer-resilience-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[renderer-resilience-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/renderer-resilience-20260826
          fetch-depth: 0

      - name: Wait for run-cancellation prerequisite
        run: |
          cp scripts/apply_renderer_resilience.py /tmp/apply_renderer_resilience.py
          ready=0
          for _ in $(seq 1 120); do
            git fetch origin main
            if git show origin/main:apps/desktop/src/transport.ts 2>/dev/null | grep -q "cancelRun"; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_renderer_resilience.py scripts/apply_renderer_resilience.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply renderer resilience changes
        run: python scripts/apply_renderer_resilience.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 35m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_renderer_resilience.py

      - name: Verify exact merge tree
        run: timeout 35m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: validate complete workspace state and preserve API problems [renderer-resilience-applied]"
          git push --force-with-lease origin HEAD:agent/renderer-resilience-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **6 of the Folio audit programme**, after real run cancellation.

          ## Implemented

          - validate the complete workspace snapshot before rendering
          - enforce safe-integer minor units and closed nested state enums
          - preserve typed problem code, retryability, and request ID through transport
          - report failed local-service state as degraded instead of silently substituting demo data
          - keep the fictional workspace available only through explicit selection or `?demo=1`
          - add permanent renderer contract tests to the desktop gate

          ## Verification

          The exact committed tree passed the full `pnpm verify` gate. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/renderer-resilience-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/renderer-resilience-20260826 \
              --title "Validate complete Folio workspace state before rendering" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/renderer-resilience-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
