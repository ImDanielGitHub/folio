name: Source Export

on:
  push:
    branches: [agent/source-export-20260826]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out verified merged main
        uses: actions/checkout@v4
        with:
          ref: 26e4439c3f17565b20334c576c8c9e5e4bae031d
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked Git objects only
        run: |
          mkdir -p /tmp/folio-git
          git bundle create /tmp/folio-git/folio.bundle --all
          git rev-parse HEAD > /tmp/folio-git/main.sha
      - name: Upload offline Git bundle
        uses: actions/upload-artifact@v4
        with:
          name: folio-git-after-pr58
          path: /tmp/folio-git/
          if-no-files-found: error
          retention-days: 2
