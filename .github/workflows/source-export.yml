name: Source Export

on:
  push:
    branches:
      - agent/source-export-20260826

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/audit-programme-20260826
          fetch-depth: 1

      - name: Create source archive
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=services/api/.venv \
            -czf /tmp/folio-audit-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: folio-audit-source
          path: /tmp/folio-audit-source.tar.gz
          if-no-files-found: error
          retention-days: 1
