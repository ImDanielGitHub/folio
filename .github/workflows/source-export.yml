name: Source Export

on:
  push:
    branches:
      - agent/source-export-20260826

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Create source archive
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=services/api/.venv \
            -czf /tmp/folio-main-after-pr2.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: folio-main-after-pr2
          path: /tmp/folio-main-after-pr2.tar.gz
          if-no-files-found: error
          retention-days: 1

# Refresh marker: current main after audit programme foundation
