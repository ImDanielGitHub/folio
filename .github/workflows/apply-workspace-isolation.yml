name: Apply workspace isolation stack

on:
  push:
    branches:
      - agent/workspace-isolation-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[workspace-isolation-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 315
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workspace-isolation-20260826
          fetch-depth: 0

      - name: Wait for accountant-export prerequisite
        run: |
          cp scripts/apply_workspace_isolation.py /tmp/apply_workspace_isolation.py
          ready=0
          for _ in $(seq 1 600); do
            git fetch origin main
            if git cat-file -e origin/main:services/api/src/finance_agent/finance/accountant_export.py 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_workspace_isolation.py scripts/apply_workspace_isolation.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply workspace isolation changes
        run: python scripts/apply_workspace_isolation.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 115m pnpm verify

      - name: Exercise isolated workspace CLI
        run: |
          temp_dir="$(mktemp -d)"
          export FOLIO_WORKSPACE_DIRECTORY="$temp_dir/directory.sqlite3"
          uv run --project services/api python scripts/workspace_control.py create ws_ci_alpha "CI Alpha"
          uv run --project services/api python scripts/workspace_control.py create ws_ci_beta "CI Beta"
          alpha="$(uv run --project services/api python scripts/workspace_control.py path ws_ci_alpha)"
          beta="$(uv run --project services/api python scripts/workspace_control.py path ws_ci_beta)"
          test "$alpha" != "$beta"
          test -f "$alpha"
          test -f "$beta"

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_workspace_isolation.py

      - name: Verify exact merge tree
        run: timeout 115m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: isolate local business workspaces by process and database [workspace-isolation-applied]"
          git push --force-with-lease origin HEAD:agent/workspace-isolation-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **22 of the Folio audit programme**, after balanced accountant exports.

          ## Implemented

          - validated process-scoped workspace and thread identity
          - one SQLite database file per registered business
          - path-safe local workspace directory and CLI
          - launcher selection through `./run --workspace <id>`
          - backwards-compatible default Koru workspace
          - development-only directory metadata

          ## Proof boundary

          This provides one active isolated workspace per API/Electron process. It does not claim concurrent multi-business UI, shared tenancy, accountant roles or multi-user authentication.

          ## Verification

          The exact committed tree passed `pnpm verify`, and CI created and opened two separate isolated workspace databases. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/workspace-isolation-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/workspace-isolation-20260826 \
              --title "Isolate local business workspaces by process and database" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/workspace-isolation-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
