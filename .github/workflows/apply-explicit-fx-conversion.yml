name: Apply explicit FX conversion stack

on:
  push:
    branches:
      - agent/explicit-fx-conversion-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[explicit-fx-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 630
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/explicit-fx-conversion-20260826
          fetch-depth: 0

      - name: Wait for analytics prerequisite
        run: |
          cp scripts/apply_explicit_fx_conversion.py /tmp/apply_explicit_fx_conversion.py
          cp scripts/patch_explicit_fx_conversion.py /tmp/patch_explicit_fx_conversion.py
          ready=0
          for _ in $(seq 1 1230); do
            git fetch origin main
            if git cat-file -e origin/main:services/api/src/finance_agent/finance/analytics.py 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_explicit_fx_conversion.py scripts/apply_explicit_fx_conversion.py
          cp /tmp/patch_explicit_fx_conversion.py scripts/patch_explicit_fx_conversion.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply FX changes and immutability correction
        run: |
          python scripts/apply_explicit_fx_conversion.py
          python scripts/patch_explicit_fx_conversion.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 225m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_explicit_fx_conversion.py scripts/patch_explicit_fx_conversion.py

      - name: Verify exact merge tree
        run: timeout 225m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add explicit evidence backed FX conversion [explicit-fx-applied]"
          git push --force-with-lease origin HEAD:agent/explicit-fx-conversion-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **43 of the Folio audit programme**, after deterministic monthly analytics.

          ## Implemented

          - pre-ledger staging of non-NZD Plaid rows in original minor units
          - append-only evidence-linked rational FX rates
          - explicit NZD target account and rate-date validation
          - exact numerator/denominator conversion with half-even rounding receipt
          - source/evidence preservation, idempotency and hard-lock enforcement
          - explicit rejection path without ledger posting

          ## Proof boundary

          Folio does not fetch, infer or claim that a supplied FX rate is legally, tax or accounting appropriate.

          ## Verification

          The exact committed tree passed the complete `pnpm verify` gate twice, including staging, rate revision, rounding, idempotency and failure tests. The one-shot transformation scripts are absent from the final diff.
          EOF
          if ! gh pr view agent/explicit-fx-conversion-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/explicit-fx-conversion-20260826 \
              --title "Add explicit evidence-backed foreign-currency conversion" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/explicit-fx-conversion-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
