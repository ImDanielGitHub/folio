name: Apply local scheduler stack

on:
  push:
    branches:
      - agent/local-scheduler-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[local-scheduler-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-scheduler-20260826
          fetch-depth: 0

      - name: Wait for backup-recovery prerequisite
        run: |
          cp scripts/apply_local_scheduler.py /tmp/apply_local_scheduler.py
          ready=0
          for _ in $(seq 1 180); do
            git fetch origin main
            if git cat-file -e origin/main:services/api/src/finance_agent/storage/backups.py 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_local_scheduler.py scripts/apply_local_scheduler.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply local scheduler changes
        run: python scripts/apply_local_scheduler.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 45m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_local_scheduler.py

      - name: Verify exact merge tree
        run: timeout 45m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add opt in durable local Daily Close scheduler [local-scheduler-applied]"
          git push --force-with-lease origin HEAD:agent/local-scheduler-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **8 of the Folio audit programme**, after local backup and recovery.

          ## Implemented

          - explicit scheduler settings that default to disabled
          - per-day idempotency and five-minute SQLite leases
          - durable quiet hours, last-run state, next-run time, and retry state
          - bounded exponential retry after failures
          - lightweight background loop that survives individual tick failures
          - scheduler receipts for completed, no-op, disabled, not-due, quiet, leased, backoff, and failed states

          ## Verification

          The exact committed tree passed the full `pnpm verify` gate. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/local-scheduler-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/local-scheduler-20260826 \
              --title "Add an opt-in durable local Daily Close scheduler" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/local-scheduler-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
