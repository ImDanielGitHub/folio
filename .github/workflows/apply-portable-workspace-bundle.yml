name: Apply portable workspace bundle stack

on:
  push:
    branches:
      - agent/portable-workspace-bundle-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[portable-bundle-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 675
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portable-workspace-bundle-20260826
          fetch-depth: 0

      - name: Wait for accounting-export prerequisite
        run: |
          cp scripts/apply_portable_workspace_bundle.py /tmp/apply_portable_workspace_bundle.py
          ready=0
          for _ in $(seq 1 1320); do
            git fetch origin main
            if git cat-file -e origin/main:services/api/src/finance_agent/finance/accounting_exports.py 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_portable_workspace_bundle.py scripts/apply_portable_workspace_bundle.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply portable bundle changes
        run: python scripts/apply_portable_workspace_bundle.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 240m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_portable_workspace_bundle.py

      - name: Verify exact merge tree
        run: timeout 240m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add portable scrubbed local data bundles [portable-bundle-applied]"
          git push --force-with-lease origin HEAD:agent/portable-workspace-bundle-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **46 of the Folio audit programme**, after balanced accounting-system CSV exports.

          ## Implemented

          - consistent SQLite snapshot plus closed hashed manifest
          - human-readable JSONL copies of non-sensitive tables
          - token/session/credential/secret table scrubbing
          - path, count, expanded-size, manifest, database and JSONL validation
          - SQLite quick-check and mode-0600 restore candidates
          - no automatic activation, replacement or merge into the live database

          ## Proof boundary

          This is a plaintext portable path capped at 10 MB. Encrypted backup remains the path for larger or confidential archives. Restore activation is a separate destructive operation and is intentionally absent.

          ## Verification

          The exact committed tree passed the complete `pnpm verify` gate twice, including tamper, traversal, scrubbing and live-database non-mutation tests. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/portable-workspace-bundle-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/portable-workspace-bundle-20260826 \
              --title "Add portable scrubbed local-data bundles" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/portable-workspace-bundle-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
