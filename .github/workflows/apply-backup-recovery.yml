name: Apply backup and recovery stack

on:
  push:
    branches:
      - agent/backup-recovery-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[backup-recovery-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/backup-recovery-20260826
          fetch-depth: 0

      - name: Wait for renderer-resilience prerequisite
        run: |
          cp scripts/apply_backup_recovery.py /tmp/apply_backup_recovery.py
          ready=0
          for _ in $(seq 1 150); do
            git fetch origin main
            if git show origin/main:apps/desktop/src/types.ts 2>/dev/null | grep -q "validateWorkspaceSnapshot"; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_backup_recovery.py scripts/apply_backup_recovery.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply backup and recovery changes
        run: python scripts/apply_backup_recovery.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 40m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_backup_recovery.py

      - name: Verify exact merge tree
        run: timeout 40m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add integrity checked workspace backup and restore [backup-recovery-applied]"
          git push --force-with-lease origin HEAD:agent/backup-recovery-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **7 of the Folio audit programme**, after renderer contract hardening.

          ## Implemented

          - SQLite online backups with manifest and database SHA-256 receipts
          - session-protected, `no-store` local archive downloads
          - archive structure, digest, SQLite integrity, schema, and workspace validation before restore
          - mode-0600 recovery copy before atomic database replacement
          - durable restore receipts containing previous and restored hashes
          - explicit `encrypted: false` truth instead of home-grown cryptography

          ## Verification

          The exact committed tree passed the full `pnpm verify` gate. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/backup-recovery-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/backup-recovery-20260826 \
              --title "Add integrity-checked local workspace backup and restore" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/backup-recovery-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
