name: Apply signed update channel stack

on:
  push:
    branches:
      - agent/signed-update-channel-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[signed-update-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 510
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/signed-update-channel-20260826
          fetch-depth: 0

      - name: Wait for unified-search prerequisite
        run: |
          cp scripts/apply_signed_update_channel.py /tmp/apply_signed_update_channel.py
          ready=0
          for _ in $(seq 1 990); do
            git fetch origin main
            if git cat-file -e origin/main:services/api/src/finance_agent/search.py 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_signed_update_channel.py scripts/apply_signed_update_channel.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply signed update changes
        run: python scripts/apply_signed_update_channel.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 185m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_signed_update_channel.py

      - name: Verify exact merge tree
        run: timeout 185m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add signed manual desktop update channel [signed-update-applied]"
          git push --force-with-lease origin HEAD:agent/signed-update-channel-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **35 of the Folio audit programme**, after unified local search.

          ## Implemented

          - closed signed update manifest schema
          - Ed25519 verification over all material update fields
          - same-origin HTTPS manifest, package and release notes
          - platform, architecture, semantic-version, size and SHA-256 checks
          - native save prompt for verified bytes
          - release-only signing helper with no private key in the repository

          ## Proof boundary

          Verified bytes are not auto-installed. Code signing, notarisation, publication, host control and an observed install require external release credentials and platform evidence.

          ## Verification

          The exact committed tree passed the complete `pnpm verify` gate, including tamper, cross-origin, platform and package-integrity tests. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/signed-update-channel-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/signed-update-channel-20260826 \
              --title "Add a signed manual desktop update channel" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/signed-update-channel-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
