name: Apply accounting period lock stack

on:
  push:
    branches:
      - agent/accounting-period-locks-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[accounting-period-locks-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 540
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/accounting-period-locks-20260826
          fetch-depth: 0

      - name: Wait for desktop-search prerequisite
        run: |
          cp scripts/apply_accounting_period_locks.py /tmp/apply_accounting_period_locks.py
          ready=0
          for _ in $(seq 1 1050); do
            git fetch origin main
            if git cat-file -e origin/main:apps/desktop/src/SearchPalette.tsx 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_accounting_period_locks.py scripts/apply_accounting_period_locks.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply accounting period changes
        run: python scripts/apply_accounting_period_locks.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 195m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_accounting_period_locks.py

      - name: Verify exact merge tree
        run: timeout 195m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add append only accounting periods and lock dates [accounting-period-locks-applied]"
          git push --force-with-lease origin HEAD:agent/accounting-period-locks-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **37 of the Folio audit programme**, after the desktop local-search palette.

          ## Implemented

          - append-only open, soft-locked and hard-locked accounting period revisions
          - non-overlapping inclusive period ranges
          - SQLite enforcement against backdated inserts and material transaction updates in hard-locked periods
          - hard-lock close receipts with exact totals, material-state hash, source digests and evidence
          - explicit unlock revisions preserving prior lock and close-receipt history
          - audit-trail and material-state identity integration

          ## Proof boundary

          These are internal bookkeeping controls. They do not prove accountant review, tax filing, external ledger locking or issued financial statements.

          ## Verification

          The exact committed tree passed the complete `pnpm verify` gate twice. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/accounting-period-locks-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/accounting-period-locks-20260826 \
              --title "Add append-only accounting periods and lock dates" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/accounting-period-locks-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
