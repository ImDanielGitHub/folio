name: Stage 8 accounting handoff

on:
  push:
    branches:
      - automation/stage-8-accounting-handoff

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  build-review-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ImDanielGitHub/folio
      PRODUCT_BRANCH: stage/08-accounting-handoff

    steps:
      - name: Check out stage automation
        uses: actions/checkout@v4
        with:
          path: automation
          fetch-depth: 1

      - name: Wait for Stage 7 to be merged
        run: |
          for attempt in $(seq 1 200); do
            count=$(gh pr list --repo "$REPOSITORY" --state merged \
              --search "head:stage/07-scheduler-outbox" \
              --json number --jq 'length' 2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then exit 0; fi
            echo "Waiting for the verified Stage 7 merge (${attempt}/200)."
            sleep 15
          done
          echo "Stage 7 did not merge before the safety timeout." >&2
          exit 1

      - name: Check out the merged product base
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Create an isolated product branch
        working-directory: repo
        run: |
          if git ls-remote --exit-code --heads origin "$PRODUCT_BRANCH" >/dev/null 2>&1; then
            echo "${PRODUCT_BRANCH} already exists; refusing an implicit overwrite." >&2
            exit 1
          fi
          git switch -c "$PRODUCT_BRANCH"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repo/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install locked dependencies
        working-directory: repo
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Materialise Stage 8 tests and implementation
        working-directory: repo
        run: python ../automation/automation/stage8_impl.py

      - name: Preserve only accounting tests for the red check
        working-directory: repo
        run: |
          rm -rf /tmp/stage8-tests
          mkdir -p /tmp/stage8-tests
          cp -a services/api/tests/. /tmp/stage8-tests/
          git reset --hard HEAD
          git clean -fd
          rm -rf services/api/tests
          mkdir -p services/api/tests
          cp -a /tmp/stage8-tests/. services/api/tests/

      - name: Verify Stage 8 regression tests fail before implementation
        working-directory: repo
        run: |
          set +e
          uv run --project services/api pytest -q services/api/tests/accounting/test_accounting_handoff.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Stage 8 accounting tests unexpectedly passed on the unmodified product." >&2
            exit 1
          fi
          echo "RED confirmed for GST review, period locks and evidence-linked exports."

      - name: Restore the clean product and apply Stage 8
        working-directory: repo
        run: |
          git reset --hard HEAD
          git clean -fd
          python ../automation/automation/stage8_impl.py
          pnpm lint:fix

      - name: Verify targeted Stage 8 behaviour
        working-directory: repo
        run: uv run --project services/api pytest -q services/api/tests/accounting/test_accounting_handoff.py

      - name: Run the complete repository verification gate
        working-directory: repo
        env:
          LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
          OPENAI_API_KEY: ""
          FOLIO_SESSION_TOKEN: stage8-ci-session
          VITE_FOLIO_SESSION_TOKEN: stage8-ci-session
        run: pnpm verify

      - name: Commit and push the verified stage
        id: commit
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs apps/desktop/src/main services/api/src services/api/tests
          git diff --cached --check
          git commit -m "feat: add deterministic accountant handoff exports"
          git push --set-upstream origin "$PRODUCT_BRANCH"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open the Stage 8 pull request
        id: pr
        working-directory: repo
        run: |
          cat > /tmp/stage8-body.md <<'EOF'
          ## Stage 8 of the Folio audit programme

          This stage prepares evidence-linked accounting work without claiming that Folio is an authoritative ledger or tax-filing system.

          ### Changes

          - add explicit accounting profiles and GST registration basis
          - seed bounded chart-of-accounts mappings for the current finance categories
          - preserve append-only transaction tax reviews with source evidence
          - calculate GST-inclusive amounts using signed 3/23 minor-unit arithmetic
          - leave unreviewed expense GST unresolved instead of inferring tax-invoice validity
          - add explicit accounting-period lock and unlock receipts
          - produce content-hashed accountant CSV and exception JSON artefacts
          - escape spreadsheet formula prefixes before CSV generation
          - serve accounting artefacts through the authenticated local artefact boundary
          - document the accounting and tax proof boundary

          ### Evidence

          The workflow records a red accounting suite on the merged Stage 7 base, then runs targeted accounting tests and the complete repository gate. Merge remains conditional on PR checks.

          ### Audit coverage

          Primary items: accounting handoff I091-I104, GST controls I105-I116, period locks B226-B235, deterministic export B236-B250 and spreadsheet security B251-B255.
          EOF
          url=$(gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "$PRODUCT_BRANCH" \
            --title "Stage 8: add deterministic GST-aware accountant handoff" \
            --body-file /tmp/stage8-body.md)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Wait for Stage 8 pull-request checks
        run: |
          sleep 12
          for attempt in $(seq 1 36); do
            if gh pr checks "${{ steps.pr.outputs.url }}" --watch --fail-fast; then exit 0; fi
            echo "Stage 8 checks are not ready or not green (${attempt}/36)."
            sleep 10
          done
          exit 1

      - name: Merge verified Stage 8
        run: |
          gh pr merge "${{ steps.pr.outputs.url }}" \
            --squash \
            --delete-branch \
            --match-head-commit "${{ steps.commit.outputs.head_sha }}"
