name: Finalise clean Stage 3a review fixes

on:
  push:
    branches:
      - agent/stage3-source-export-20260827

permissions:
  contents: write

concurrency:
  group: finalise-clean-stage3a
  cancel-in-progress: true

jobs:
  finalise:
    if: ${{ contains(github.event.head_commit.message, '[finalise-stage3a]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      TARGET_BRANCH: agent/stage3-client-protocol-20260827

    steps:
      - name: Check out clean Stage 3a branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage3-client-protocol-20260827
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply review regressions and minimal fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          protocol = Path("apps/desktop/src/protocol.ts")
          text = protocol.read_text(encoding="utf-8")
          old = """export function shouldRetryRequest(
            method: string,
            status: number | null,
            networkFailure = false,
          ): boolean {
            if (!SAFE_METHODS.has(method.toUpperCase())) return false;
            if (networkFailure) return true;
            return status !== null && RETRYABLE_STATUSES.has(status);
          }
          """
          new = """export function shouldRetryRequest(
            method: string,
            status: number | null,
            networkFailure = false,
            declaredRetryable = true,
          ): boolean {
            if (!declaredRetryable || !SAFE_METHODS.has(method.toUpperCase())) return false;
            if (networkFailure) return true;
            return status !== null && RETRYABLE_STATUSES.has(status);
          }
          """
          if text.count(old) != 1:
              raise SystemExit("expected one retry policy implementation")
          protocol.write_text(text.replace(old, new), encoding="utf-8")

          transport = Path("apps/desktop/src/transport.ts")
          text = transport.read_text(encoding="utf-8")
          old = "        || !shouldRetryRequest(method, response.status)\n"
          new = (
              "        || !shouldRetryRequest(\n"
              "          method, response.status, false, problem.retryable,\n"
              "        )\n"
          )
          if text.count(old) != 1:
              raise SystemExit("expected one response retry decision")
          transport.write_text(text.replace(old, new), encoding="utf-8")

          protocol_test = Path("apps/desktop/tests/protocol.test.ts")
          text = protocol_test.read_text(encoding="utf-8")
          old = '  assert.equal(shouldRetryRequest("GET", 503), true);\n'
          new = old + (
              '  assert.equal(shouldRetryRequest("GET", 503, false, false), false);\n'
          )
          if text.count(old) != 1:
              raise SystemExit("expected one retry policy assertion anchor")
          protocol_test.write_text(text.replace(old, new), encoding="utf-8")

          problems = Path("services/api/src/finance_agent/api/problems.py")
          text = problems.read_text(encoding="utf-8")
          marker = '\n\n__all__ = ["install_problem_handlers", "problem_payload", "problem_response"]\n'
          handler = '''

              @app.exception_handler(Exception)
              async def unexpected_problem(request: Request, _: Exception) -> JSONResponse:
                  return problem_response(
                      request,
                      status=500,
                      detail="The local Folio service could not complete the request.",
                      code="internal_error",
                      retryable=False,
                  )
          '''
          if text.count(marker) != 1:
              raise SystemExit("expected one module export marker")
          if "async def unexpected_problem" in text:
              raise SystemExit("unexpected handler already exists")
          problems.write_text(text.replace(marker, handler + marker), encoding="utf-8")

          problem_test = Path("services/api/tests/api/test_problem_details.py")
          text = problem_test.read_text(encoding="utf-8")
          addition = '''

          class _ExplodingSnapshotService:
              async def workspace_snapshot(self, workspace_id: str) -> dict[str, object]:
                  del workspace_id
                  raise RuntimeError("sensitive database internals")


          @pytest.mark.asyncio
          async def test_unexpected_errors_use_generic_problem_details(tmp_path: Path) -> None:
              app = create_app(database_path=tmp_path / "unexpected.sqlite3", auto_seed=True)
              original = app.state.finance_route_services
              app.state.finance_route_services = _ExplodingSnapshotService()
              try:
                  async with httpx.AsyncClient(
                      transport=httpx.ASGITransport(app=app, raise_app_exceptions=False),
                      base_url="http://test",
                  ) as client:
                      response = await client.get("/v1/workspaces/ws_koru_studio/snapshot")
              finally:
                  await original.aclose()

              assert response.status_code == 500
              assert response.headers["content-type"].startswith("application/problem+json")
              payload = response.json()
              assert payload["code"] == "internal_error"
              assert payload["retryable"] is False
              assert payload["detail"] == (
                  "The local Folio service could not complete the request."
              )
              assert "sensitive database internals" not in response.text
          '''
          if "test_unexpected_errors_use_generic_problem_details" in text:
              raise SystemExit("unexpected-error regression already exists")
          problem_test.write_text(text + addition, encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply repository formatting rules
        run: |
          uv run --project services/api ruff check --fix --unsafe-fixes --config services/api/pyproject.toml services/api/src services/api/tests
          git diff --check

      - name: Run complete verification gate
        run: pnpm verify

      - name: Verify unchanged review surface
        run: |
          set -euo pipefail
          git fetch --prune origin main
          cat > /tmp/expected-files <<'EOF'
          .gitignore
          apps/desktop/package.json
          apps/desktop/src/App.tsx
          apps/desktop/src/protocol.ts
          apps/desktop/src/runtimePolicy.ts
          apps/desktop/src/transport.ts
          apps/desktop/src/types.ts
          apps/desktop/src/vite-env.d.ts
          apps/desktop/tests/protocol.test.ts
          apps/desktop/tsconfig.tests.json
          docs/AUDIT_PROGRAMME.md
          services/api/src/finance_agent/api/app.py
          services/api/src/finance_agent/api/http_security.py
          services/api/src/finance_agent/api/problems.py
          services/api/src/finance_agent/api/routes/router.py
          services/api/tests/api/test_problem_details.py
          EOF
          sort -o /tmp/expected-files /tmp/expected-files
          git diff --name-only origin/main...HEAD | sort > /tmp/actual-files-before
          diff -u /tmp/expected-files /tmp/actual-files-before
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -E '(^|/)(\.stage3|finalise-stage3a|materialise-stage3a|source-export-stage3|apply-client-protocol|apply_.*stack)'; then
            echo "Staging machinery leaked into the clean branch" >&2
            exit 1
          fi

      - name: Commit and push reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: honour protocol retryability and sanitise internal failures [stage3a-review]"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
