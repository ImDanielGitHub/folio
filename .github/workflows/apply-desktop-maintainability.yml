name: Apply desktop maintainability stack

on:
  push:
    branches:
      - agent/desktop-maintainability-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[desktop-maintainability-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-maintainability-20260826
          fetch-depth: 0

      - name: Wait for workspace-isolation prerequisite
        run: |
          cp scripts/apply_desktop_maintainability.py /tmp/apply_desktop_maintainability.py
          ready=0
          for _ in $(seq 1 630); do
            git fetch origin main
            if git cat-file -e origin/main:services/api/src/finance_agent/workspace.py 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_desktop_maintainability.py scripts/apply_desktop_maintainability.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply desktop maintainability changes
        run: python scripts/apply_desktop_maintainability.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 120m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_desktop_maintainability.py

      - name: Verify exact merge tree
        run: timeout 120m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: split desktop message rendering and guard UI contracts [desktop-maintainability-applied]"
          git push --force-with-lease origin HEAD:agent/desktop-maintainability-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **23 of the Folio audit programme**, after workspace isolation.

          ## Implemented

          - extracted and memoised thread-message component
          - explicit callback boundary and focused control tests
          - versioned, clamped and failure-tolerant persistent thread width
          - off-screen content visibility for long conversation and finance lists
          - permanent UI contract for breakpoint, motion, contrast and focus rules

          ## Proof boundary

          Static and component checks do not replace observed mobile, desktop, keyboard and assistive-technology runtime inspection.

          ## Verification

          The exact committed tree passed the complete `pnpm verify` gate, including accessibility and UI-contract checks. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/desktop-maintainability-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/desktop-maintainability-20260826 \
              --title "Split desktop message rendering and guard UI contracts" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/desktop-maintainability-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
