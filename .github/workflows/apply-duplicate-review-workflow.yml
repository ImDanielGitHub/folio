name: Apply duplicate review workflow stack

on:
  push:
    branches:
      - agent/duplicate-review-workflow-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[duplicate-review-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 645
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/duplicate-review-workflow-20260826
          fetch-depth: 0

      - name: Wait for FX prerequisite
        run: |
          cp scripts/apply_duplicate_review_workflow.py /tmp/apply_duplicate_review_workflow.py
          ready=0
          for _ in $(seq 1 1260); do
            git fetch origin main
            if git cat-file -e origin/main:services/api/src/finance_agent/finance/foreign_currency.py 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_duplicate_review_workflow.py scripts/apply_duplicate_review_workflow.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply duplicate review changes
        run: python scripts/apply_duplicate_review_workflow.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 230m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_duplicate_review_workflow.py

      - name: Verify exact merge tree
        run: timeout 230m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add deterministic duplicate review workflow [duplicate-review-applied]"
          git push --force-with-lease origin HEAD:agent/duplicate-review-workflow-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **44 of the Folio audit programme**, after explicit foreign-currency conversion.

          ## Implemented

          - exact amount/currency and bounded-date duplicate candidates
          - visible description-similarity and cross-source score factors
          - no mutation during scanning
          - owner-selected keeper with both evidence links
          - one active duplicate decision per duplicate transaction
          - non-mutating reject and append-only Undo restoring exact prior state
          - hard-lock, audit-trail and material-state identity integration

          ## Proof boundary

          A high candidate score is not proof of duplication. Confirmation does not delete immutable source records.

          ## Verification

          The exact committed tree passed the complete `pnpm verify` gate twice. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/duplicate-review-workflow-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/duplicate-review-workflow-20260826 \
              --title "Add a deterministic duplicate review workflow" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/duplicate-review-workflow-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
