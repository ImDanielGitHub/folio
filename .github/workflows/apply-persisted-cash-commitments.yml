name: Apply persisted cash commitment stack

on:
  push:
    branches:
      - agent/persisted-cash-commitments-20260826

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-verify-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[cash-commitments-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 285
    env:
      LM_STUDIO_BASE_URL: http://127.0.0.1:65530/v1
      OPENAI_API_KEY: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/persisted-cash-commitments-20260826
          fetch-depth: 0

      - name: Wait for observability prerequisite
        run: |
          cp scripts/apply_persisted_cash_commitments.py /tmp/apply_persisted_cash_commitments.py
          ready=0
          for _ in $(seq 1 540); do
            git fetch origin main
            if git cat-file -e origin/main:services/api/src/finance_agent/observability.py 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          git reset --hard origin/main
          mkdir -p scripts
          cp /tmp/apply_persisted_cash_commitments.py scripts/apply_persisted_cash_commitments.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Apply persisted commitment changes
        run: python scripts/apply_persisted_cash_commitments.py

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project services/api --frozen

      - name: Apply safe formatting fixes
        run: pnpm lint:fix

      - name: Verify transformed repository
        run: timeout 105m pnpm verify

      - name: Remove one-shot transformation machinery
        run: rm -f scripts/apply_persisted_cash_commitments.py

      - name: Verify exact merge tree
        run: timeout 105m pnpm verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: persist cash commitments and generalise scenarios [cash-commitments-applied]"
          git push --force-with-lease origin HEAD:agent/persisted-cash-commitments-20260826

      - name: Open reviewable pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Stack position

          **20 of the Folio audit programme**, after local observability.

          ## Implemented

          - persisted exact-money cash commitments replacing source-code forecast constants
          - bounded none, weekly and monthly recurrence
          - explicit planned, confirmed, cancelled and completed states
          - commitment content in Daily Close material identity
          - baseline-preserving delay and exclusion scenarios
          - append-only committed scenario revisions with hashes and assumptions

          ## Proof boundary

          Forecasts remain transparent calculations over explicit commitments and are not presented as predictions.

          ## Verification

          The exact committed tree passed the complete `pnpm verify` gate. The one-shot transformation script is absent from the final diff.
          EOF
          if ! gh pr view agent/persisted-cash-commitments-20260826 >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head agent/persisted-cash-commitments-20260826 \
              --title "Persist cash commitments and generalise scenarios" \
              --body-file /tmp/pr-body.md
          fi

      - name: Merge verified stack
        run: |
          pr_number="$(gh pr view agent/persisted-cash-commitments-20260826 --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          gh pr ready "$pr_number" || true
          gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$head_sha"
